<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Lights Out</title>
  <!-- inline favicon: avoids a 404 /favicon.ico request on every load -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2306111e'/%3E%3Cpath d='M9.5 1.5 4 9h3l-1 5.5L11.5 7h-3z' fill='%230ce4f9'/%3E%3C/svg%3E" />
  <!-- fonts trimmed to what the UI renders: Exo 2 400 (rotate hint sub), 700 (bot bar, loading bar, rotate hint), 900 (Well done!) + Lilita One (tile numbers, Play label) -->
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;700;900&family=Lilita+One&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
    }
    body {
      background: #06111e;
      touch-action: manipulation;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Fixed design canvas: 1920 × 1080 (Figma native) ──
       Positioned top-left and centered via translate+scale in JS,
       so it fits any display size without flexbox-overflow miscentering. */
    #canvas {
      width: 1920px; height: 1080px;
      position: absolute;
      top: 0; left: 0;
      transform-origin: top left;
      background: #06111e url('assets/background.webp') center / cover no-repeat;
      overflow: hidden;
    }

    /* ── Animations ──────────────────────────────── */
    @keyframes fadeIn   { from { opacity:0; transform:translateY(6px); }  to { opacity:1; transform:translateY(0); } }
    @keyframes popIn    { from { opacity:0; transform:scale(0.45); }       to { opacity:1; transform:scale(1); } }
    @keyframes shake    { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-8px);} 40%{transform:translateX(8px);} 60%{transform:translateX(-5px);} 80%{transform:translateX(5px);} }
    @keyframes hintGlow  { 0%,100%{filter:brightness(1.05) drop-shadow(0 0 10px rgba(0,229,255,.75));} 50%{filter:brightness(1.3) drop-shadow(0 0 30px rgba(0,229,255,1)) drop-shadow(0 0 60px rgba(0,229,255,.55));} }
    @keyframes pulse    { 0%,100%{filter:brightness(1);}  50%{filter:brightness(1.28) drop-shadow(0 0 18px #4afa7c);} }

    /* ════════════════════════════════════════════
       QUESTION SCREEN — Figma layout (node 956:7170)
    ════════════════════════════════════════════ */

    /* Robot (top-left) */
    #qrobot {
      position: absolute;
      left: 55px; top: -16px;
      width: 196px; height: 257px;
      overflow: hidden;
      z-index: 5;
    }
    /* Byte dancing in the top-left (tutorial completion) */
    #byte-dance {
      position: absolute;
      left: 20px; top: -14px;
      width: 235px; height: auto;
      z-index: 6;
      display: none;
      transform-origin: center bottom;
      filter: drop-shadow(0 0 18px rgba(0,220,255,.45));
    }
    #byte-dance.show { display: block; }   /* the GIF animates itself */
    #qrobot img {
      position: absolute;
      left: -61.46%; top: -0.09%;
      width: 232.81%; height: 100.17%;
      max-width: none;
    }

    /* Bot text bar (the long top frame) */
    #bot-bar {
      position: absolute;
      left: 161px; top: 32px;
      width: 1499px; height: 150.654px;
      z-index: 4;
    }
    #bot-bar .frame {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    #bot-text {
      position: absolute;
      left: 116px; right: 40px;
      top: 48%; transform: translateY(-50%);
      font-family: 'Exo 2', sans-serif;
      font-size: 34px; font-weight: 700;
      color: #dff4f8;
      text-shadow: 0 0 10px rgba(0,200,230,.5);
      white-space: nowrap;
      text-align: left;
    }

    /* Power button (top-right) */
    #power-btn {
      position: absolute;
      left: 1695px; top: 32px;
      width: 183px; height: 178px;
      object-fit: contain;
      z-index: 2;
    }
    #power-btn.pulsing { animation: pulse 1.2s ease-in-out infinite; }

    /* Glowing pipe connectors (behind panels) */
    .connector { position: absolute; z-index: 1; pointer-events: none; }
    .cclip { position: absolute; inset: 0; overflow: hidden; }
    .cclip img { position: absolute; max-width: none; transition: filter 0.25s ease; }

    /* flowing current — a green copy of the pipe, revealed as a sharp bright bolt of light
       that zips along the tube (a lightning pass, confined to the exact pipe shape) */
    .cclip .flow {
      position: absolute;
      max-width: none;
      opacity: 0;
      pointer-events: none;
      filter: brightness(2.7) saturate(2.1) hue-rotate(-88deg);
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, transparent 36%, #000 47%, #000 53%, transparent 64%, transparent 100%);
      mask-image: linear-gradient(90deg, transparent 0%, transparent 36%, #000 47%, #000 53%, transparent 64%, transparent 100%);
      -webkit-mask-size: 60% 100%; mask-size: 60% 100%;
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    }
    @keyframes currentFlow {
      from { -webkit-mask-position: -60% 0; mask-position: -60% 0; }
      to   { -webkit-mask-position: 165% 0; mask-position: 165% 0; }
    }
    #screen-question.current-on .connector:not(.cn-small) .flow {
      opacity: 1;
      animation: currentFlow 1.15s linear 0.4s infinite both;   /* slower so the surge is clearly noticeable */
    }
    #screen-question.current-on .cclip img:not(.flow) { filter: brightness(1.15); }

    /* Main panel */
    #main-panel {
      position: absolute;
      left: 72px; top: 215px;
      width: 1573.948px; height: 453px;
      z-index: 3;
    }

    /* Entrance: the box appears as a bright line, then opens vertically */
    #main-panel.opening {
      animation: panelOpen 1.9s cubic-bezier(0.22, 1.04, 0.36, 1) 1.0s both;
    }
    @keyframes panelOpen {
      0%   { opacity: 0; transform: scale(0.42, 0.02);
             filter: brightness(2.3) drop-shadow(0 0 46px rgba(15,229,250,1)); }
      16%  { opacity: 1; transform: scale(1, 0.025);
             filter: brightness(2.3) drop-shadow(0 0 46px rgba(15,229,250,1)); }
      55%  { transform: scale(1, 1.05);
             filter: brightness(1.35) drop-shadow(0 0 26px rgba(15,229,250,.6)); }
      75%  { transform: scale(1, 0.985); }
      100% { opacity: 1; transform: scale(1, 1); filter: none; }
    }

    /* ── Playful one-by-one entrance for the question screen ── */
    @keyframes robotBounceIn {
      0%   { opacity: 0; transform: translateY(-52px) scale(0.4); }
      55%  { opacity: 1; transform: translateY(8px)  scale(1.12); }
      78%  {             transform: translateY(-4px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0)    scale(1); }
    }
    @keyframes barExpandIn {
      0%   { opacity: 0; transform: scaleX(0.12); }
      60%  { opacity: 1; transform: scaleX(1.04); }
      100% { opacity: 1; transform: scaleX(1); }
    }
    @keyframes popBounceIn {
      0%   { opacity: 0; transform: scale(0.3)  translateY(16px); }
      55%  { opacity: 1; transform: scale(1.15) translateY(-6px); }
      78%  {             transform: scale(0.95) translateY(2px); }
      100% { opacity: 1; transform: scale(1)    translateY(0); }
    }
    @keyframes connDrawIn {
      0%   { opacity: 0; transform: scale(0.55); }
      70%  { opacity: 1; transform: scale(1.04); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes switchDrop {
      0%   { opacity: 0; transform: translateY(-46px) scale(0.7); }
      60%  { opacity: 1; transform: translateY(6px)   scale(1.06); }
      80%  {             transform: translateY(-2px)  scale(0.98); }
      100% { opacity: 1; transform: translateY(0)     scale(1); }
    }

    #screen-question.intro #qrobot    { animation: robotBounceIn 0.85s cubic-bezier(0.34,1.56,0.64,1) 0.15s both; transform-origin: center bottom; }
    /* bot bar appears LAST (after switches + options + vent), then types its text */
    #bot-bar.bar-hidden { opacity: 0; pointer-events: none; }
    #bot-bar.bar-reveal { animation: barExpandIn 0.6s cubic-bezier(0.34,1.4,0.64,1) both; transform-origin: left center; }
    /* blue pipe + red power button appear together, AFTER the box has fully opened (~2.9s) */
    #screen-question.intro #power-btn { animation: popBounceIn 0.78s cubic-bezier(0.34,1.56,0.64,1) 2.95s both; }
    #screen-question.intro .connector:not(.opt-pipe) { animation: connDrawIn 0.65s cubic-bezier(0.34,1.4,0.64,1) 2.95s both; }
    #panel-frame {
      position: absolute;
      left: -0.79%; top: 0;
      width: 101.58%; height: 102.76%;
      pointer-events: none;
    }
    /* Vent indicator bars — sit on top of the panel housing */
    .vent-bars { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
    .vent-bar {
      position: absolute;
      border-radius: 4px;
      background: #0ce4f9;
      box-shadow: 0 0 3px rgba(12,228,249,.4), inset 0 0 3px rgba(255,255,255,.22);
      transition: background .18s ease, box-shadow .18s ease;
    }
    #main-panel.vent-correct .vent-bar {
      background: #2bff7a;
      box-shadow: 0 0 13px rgba(43,255,122,.95), inset 0 0 4px rgba(255,255,255,.4);
    }
    #main-panel.vent-wrong .vent-bar {
      background: #ffb020;
      box-shadow: 0 0 13px rgba(255,176,32,.95), inset 0 0 4px rgba(255,255,255,.4);
    }
    #main-panel.row-complete .vent-bar { display: none; }

    /* pattern complete: a bright green pulse flows through the vent bars (left → right, toward the pipe) */
    @keyframes ventFlow {
      from { background-position: -130% 0; }
      to   { background-position: 230% 0; }
    }
    #screen-question.current-on .vent-bar {
      background: linear-gradient(90deg, #1aa84a 0%, #5dff95 42%, #eaffef 50%, #5dff95 58%, #1aa84a 100%);
      background-size: 260% 100%;
      box-shadow: 0 0 13px rgba(60,255,140,.9), inset 0 0 4px rgba(255,255,255,.45);
      animation: ventFlow 1.0s linear infinite;
    }
    #screen-question.current-on .vent-bar:nth-child(1) { animation-delay: 0s; }
    #screen-question.current-on .vent-bar:nth-child(2) { animation-delay: 0.12s; }
    #screen-question.current-on .vent-bar:nth-child(3) { animation-delay: 0.24s; }

    /* Switch row */
    #switch-row {
      position: absolute;
      left: 0; right: 0;
      top: 156px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 23px;
      z-index: 2;
    }

    /* ── Switch tile (slot) ── */
    .sw {
      width: 128px; height: 174px;
      flex-shrink: 0;
      border-radius: 11px;
    }
    .tile {
      position: relative;
      width: 100%; height: 100%;
      background-image: url('assets/figma/tile.webp');
      background-repeat: no-repeat;
      background-size: 248.81% 138.26%;
      background-position: 49.6% 57.92%;
      border-radius: 8px;
    }
    .tile-num {
      position: absolute;
      left: 50%; top: 45%;
      transform: translate(-50%, -50%);
      font-family: 'Lilita One', cursive;
      font-weight: 400;
      font-size: 80px;
      line-height: 1;
      color: #000;
    }

    @keyframes correctGlow {
      0%   { box-shadow: 0 0  0px  0px rgba(255,255,255,0); }
      25%  { box-shadow: 0 0 22px 10px rgba(255,255,255,.95), 0 0 50px 20px rgba(255,255,255,.4); }
      100% { box-shadow: 0 0  0px  0px rgba(255,255,255,0); }
    }

    .sw.filled .tile  { animation: fadeIn 0.3s ease both; }
    .sw.new           { animation: correctGlow 0.95s ease-out both; }
    .sw.new    .tile  { animation: popIn  0.55s ease both; }

    /* "read the pattern" highlight — each prefilled switch pops + glows as its number is read */
    @keyframes readPop {
      0%   { transform: scale(1);    filter: drop-shadow(0 0 0 rgba(0,229,255,0)); }
      40%  { transform: scale(1.16); filter: drop-shadow(0 0 16px rgba(0,229,255,.95)); }
      100% { transform: scale(1);    filter: drop-shadow(0 0 0 rgba(0,229,255,0)); }
    }
    .sw.read-pop { animation: readPop 0.62s ease-out; position: relative; z-index: 4; }

    /* Empty slots — cyan neon border (Figma #a3fffc); no glow on the active slot */
    .sw.empty {
      background: transparent;
      border: 4px solid #a3fffc;
      border-radius: 11px;
    }

    @keyframes wrongGlowPulse {
      0%   { box-shadow: 0 0 0 0 rgba(255,176,32,0);           outline-color: rgba(255,200,96,.35); }
      16%  { box-shadow: 0 0 34px 12px rgba(255,176,32,.95), 0 0 68px 26px rgba(255,150,20,.5); outline-color: #ffc23c; }
      100% { box-shadow: 0 0 18px 4px rgba(255,176,32,.7);    outline-color: #ffb020; }
    }
    .sw.wrong-option { animation: shake 0.45s ease; }
    .sw.wrong-option .tile {
      outline: 3px solid #ffb020;
      border-radius: 8px;
      animation: wrongGlowPulse 0.8s ease-out both;
    }

    /* sparks flung from a wrong switch (warm amber/gold — no red) */
    .spark {
      position: absolute;
      left: 50%; top: 45%;
      width: 6px; height: 6px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 40;
      box-shadow: 0 0 10px 3px rgba(255,190,70,.95);
    }
    .spark-burst {
      position: absolute;
      left: 50%; top: 45%;
      width: 110px; height: 110px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 39;
      background: radial-gradient(circle, rgba(255,228,150,.95) 0%, rgba(255,184,70,.5) 40%, rgba(255,184,70,0) 70%);
    }

    /* Completed-row switch styling */
    .sw.complete-fill .tile {
      outline: 2px solid rgba(120, 235, 255, 0.8);
      box-shadow: 0 0 12px rgba(0, 220, 255, .45);
      border-radius: 8px;
      animation: fadeIn 0.3s ease both;
    }

    /* Panel green-glow state for row-complete */
    @keyframes greenBorderPulse {
      0%,100% { box-shadow: 0 0 0 4px #4afa7c, 0 0 35px rgba(74,250,124,.55), 0 0 80px rgba(74,250,124,.22); }
      50%     { box-shadow: 0 0 0 4px #4afa7c, 0 0 62px rgba(74,250,124,.88), 0 0 130px rgba(74,250,124,.42); }
    }

    #main-panel.row-complete {
      left: 72px; top: 130px;
      width: 1776px; height: 820px;
      border-radius: 24px;
      background: #041840;
      z-index: 10;
      animation: greenBorderPulse 1.2s ease-in-out infinite;
      transition: top 0.35s ease, height 0.35s ease, width 0.35s ease, left 0.35s ease, background 0.3s ease;
    }
    #main-panel.row-complete #panel-frame { opacity: 0; }
    #main-panel.row-complete #switch-row {
      top: 50%;
      transform: translateY(-50%);
      transition: filter 0.3s ease, opacity 0.3s ease;
    }

    /* Hide surrounding chrome during celebration.
       visibility:hidden lands AFTER the fade (0s delay trick) so fully-occluded
       elements release their paint/compositing work instead of sitting at opacity 0;
       removing the class restores them instantly (base rule has no transition). */
    #screen-question.celebrating #qrobot,
    #screen-question.celebrating #power-btn,
    #screen-question.celebrating #bot-bar,
    #screen-question.celebrating .connector,
    #screen-question.celebrating #options-box {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.3s ease, visibility 0s linear 0.3s;
    }

    /* Hide switches when Well done appears (same delayed-visibility release) */
    #main-panel.well-done-active #switch-row {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.4s ease, visibility 0s linear 0.4s;
    }

    /* Well done overlay */
    @keyframes wellDonePop {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.55); }
      to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    @keyframes robotDance {
      0%,100% { transform: translateY(0)    rotate(0deg);   }
      15%     { transform: translateY(-18px) rotate(-8deg);  }
      30%     { transform: translateY(0)    rotate(0deg);   }
      45%     { transform: translateY(-14px) rotate(7deg);   }
      60%     { transform: translateY(0)    rotate(0deg);   }
      75%     { transform: translateY(-10px) rotate(-5deg);  }
      90%     { transform: translateY(0)    rotate(0deg);   }
    }

    #well-done-msg {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      pointer-events: none;
      z-index: 20;
      white-space: nowrap;
      animation: wellDonePop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    #well-done-msg.hidden { display: none !important; }

    #robot-dance {
      width: 180px;
      height: auto;
      animation: robotDance 1s ease-in-out infinite;
      filter: drop-shadow(0 0 18px rgba(0,220,255,.45));
    }

    #well-done-text {
      font-family: 'Exo 2', sans-serif;
      font-size: 110px;
      font-weight: 900;
      color: #00e8ff;
      letter-spacing: 2px;
      text-shadow: 0 0 40px rgba(0,232,255,.7), 0 0 80px rgba(0,200,255,.35), 0 4px 0 rgba(0,0,0,.45);
    }

    /* Options box (bottom) */
    #options-box {
      position: absolute;
      left: 488.38px; top: 728px;
      width: 742.047px; height: 256px;
      z-index: 3;
    }
    #options-box .frame {
      position: absolute;
      left: -0.79%; top: 0;
      width: 101.58%; height: 102.3%;
      pointer-events: none;
    }
    #options-area {
      position: absolute;
      left: 0; right: 0;
      top: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 38px;
      z-index: 2;
    }
    #options-area.invisible { visibility: hidden; pointer-events: none; }

    @keyframes optTilePop {
      0%   { opacity: 0; transform: translateY(24px) scale(0.55); }
      60%  { opacity: 1; transform: translateY(-5px) scale(1.12); }
      80%  {             transform: translateY(2px)  scale(0.96); }
      100% { opacity: 1; transform: translateY(0)    scale(1); }
    }
    #options-area.hidden-initially {
      opacity: 0;
      pointer-events: none;
    }
    /* all 4 option switches pop in together AFTER the box has deployed */
    #options-area.reveal .sw {
      animation: optTilePop 0.95s cubic-bezier(0.34,1.5,0.5,1) both;
    }

    /* Inactivity nudge — the options bounce (in a wave), looping, then rest each cycle */
    @keyframes idleBounce {
      0%   { transform: translateY(0); }
      12%  { transform: translateY(-18px); }
      26%  { transform: translateY(0); }
      36%  { transform: translateY(-8px); }
      46%  { transform: translateY(0); }
      100% { transform: translateY(0); }   /* rest for the remainder of the cycle */
    }
    /* loops (~4 bounces over ~5.5s); the JS removes the class after ~5.5s */
    #options-area.idle-nudge .sw { animation: idleBounce 1.4s cubic-bezier(0.3,1,0.5,1) infinite; }
    #options-area.idle-nudge .sw:nth-child(1) { animation-delay: 0s; }
    #options-area.idle-nudge .sw:nth-child(2) { animation-delay: 0.07s; }
    #options-area.idle-nudge .sw:nth-child(3) { animation-delay: 0.14s; }
    #options-area.idle-nudge .sw:nth-child(4) { animation-delay: 0.21s; }

    /* ── Deploy: options box emerges from the main panel ── */
    /* 1. the two link pipes shoot down out of the panel bottom */
    .opt-pipe { transform-origin: top center; }
    .opt-pipe.hidden-initially { opacity: 0; transform: scaleY(0); }
    .opt-pipe.extend { animation: pipeExtend 0.95s cubic-bezier(0.3, 1, 0.4, 1) both; }
    @keyframes pipeExtend {
      0%   { opacity: 0.25; transform: scaleY(0); }
      70%  { opacity: 1;    transform: scaleY(1.06); }
      100% { opacity: 1;    transform: scaleY(1); }
    }

    /* 2. the box unfolds downward out of the panel, riding the pipes */
    #options-box { transform-origin: top center; }
    #options-box.hidden-initially { opacity: 0; pointer-events: none; }
    #options-box.deploy {
      animation: optionsBoxDeploy 1.4s cubic-bezier(0.22, 1.15, 0.36, 1) both;
    }
    @keyframes optionsBoxDeploy {
      0%   { opacity: 0; transform: translateY(-70px) scaleY(0.5);
             filter: brightness(1.7) drop-shadow(0 0 30px rgba(15,229,250,.95)); }
      55%  { opacity: 1; transform: translateY(14px) scaleY(1.06);
             filter: brightness(1.25) drop-shadow(0 0 18px rgba(15,229,250,.6)); }
      78%  { transform: translateY(-5px) scaleY(0.99); }
      100% { opacity: 1; transform: translateY(0) scaleY(1); filter: none; }
    }
    /* on completion the option placeholder retracts back up into the panel/vent */
    #options-box.retract { animation: optionsBoxRetract 0.55s cubic-bezier(0.5, 0, 0.75, 0.4) forwards; }
    @keyframes optionsBoxRetract {
      0%   { opacity: 1; transform: translateY(0) scaleY(1); }
      100% { opacity: 0; transform: translateY(-80px) scaleY(0.32); }
    }
    .opt-pipe.retract { animation: pipeRetract 0.5s ease forwards; }
    @keyframes pipeRetract {
      from { opacity: 1; transform: scaleY(1); }
      to   { opacity: 0; transform: scaleY(0); }
    }

    /* Option tiles — slightly smaller than the row tiles */
    #options-area .sw { width: 112.208px; height: 152.533px; }
    #options-area .tile-num { font-size: 70px; }

    .sw.option {
      cursor: pointer;
      transition: transform 0.13s;
    }
    .sw.option:hover { transform: scale(1.08); }

    .sw.hint { cursor: pointer; position: relative; animation: hintGlow 0.9s ease-in-out infinite; z-index: 3; }
    .sw.hint .tile {
      outline: 4px solid #00e5ff;
      border-radius: 8px;
    }
    .sw.hint:hover { transform: scale(1.08); }


    /* ════════════════════════════════════════════
       INTRO / COMPLETE SCREENS
    ════════════════════════════════════════════ */
    #screen-intro {
      position: absolute;
      inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end;
      padding-bottom: 80px;
      animation: fadeIn 0.5s ease;

    #title-screen-img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;

    /* ── Title-screen PLAY button (image asset, bottom-right corner) ── */
    #screen-intro .btn-play {
      position: absolute;
      right: 104px; bottom: 88px;

    .btn-play {

      position: relative; display: block; will-change: transform;
    }
    .btn-play img {
      width: 300px; height: auto; display: block;
      will-change: filter;
      /* fallback shaped glow + depth (GSAP animates this when loaded) */
      filter: drop-shadow(0 0 16px rgba(12,228,249,0.5)) drop-shadow(0 7px 14px rgba(0,16,32,0.55));
    }

    /* deferred media: no broken-image glyph while the preloader hasn't fed a src yet */
    img[data-src]:not([src]) { visibility: hidden; }

    /* ── Rotate-to-landscape hint (narrow portrait phones only) ── */
    #rotate-hint {
      display: none;
      position: fixed; inset: 0;
      z-index: 1000;
      background: radial-gradient(circle at 50% 40%, #0c1d38 0%, #05101f 100%);

    /* ── Boot loading bar — sits exactly where the PLAY button will appear.

    #boot-bar {

    #btn-play.preloading { visibility: hidden; pointer-events: none; }
    #btn-play.boot-reveal { animation: popIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) both; }

    /* ════════════════════════════════════════════

    #fx-confetti {
      position: absolute; inset: 0;

    }

    /* ════════════════════════════════════════════
       LEVEL TRANSITION — sci-fi blast doors
    ════════════════════════════════════════════ */
    #transition {
      position: absolute; inset: 0;
      z-index: 60; pointer-events: none;

        repeating-linear-gradient(90deg, rgba(15,229,250,0.045) 0 2px, transparent 2px 72px),
        linear-gradient(180deg, #0c1d38 0%, #05101f 100%);

    .trans-top {

      74%    { opacity: 1;    transform: translateY(-50%) scaleX(1); }

    /* ════════════════════════════════════════════
       END / COMPLETE SCREEN
    ════════════════════════════════════════════ */
    #screen-complete {

      inset: 0;

      animation: fadeIn 0.55s ease both;

      object-fit: cover;
      display: block;

<!-- GSAP (for the play-button attention effects) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  /* ── Asset pipeline ────────────────────────────────
     The boot preloader streams every asset with byte-accurate progress, swaps in
     blob: URLs (so "loaded" truly means local), and falls back to the original
     path on any failure — file://, offline, 404, or a stalled transfer.
     Media formats: WebM (VP9+Opus) video, Ogg (Opus) audio, WebP images —
     supported by Chrome, Edge, Firefox and recent Safari (17.4+ / macOS 14+). */
  const ASSET_BLOBS = Object.create(null);   /* path → blob: URL (set only on success) */
  const assetUrl = p => ASSET_BLOBS[p] || p;
  let _assetsReady = false;                  /* gates handleStart until the preloader hits 100% */

  /* audio elements are created with preload="none" so the preloader's streamed
     fetch is the ONLY download; it then feeds each element its blob: URL */
  const _audioRegistry = [];
  function mkAudio(path) {
    const a = new Audio();
    a.preload = 'none';
    a.src = path;
    _audioRegistry.push({ el: a, path });
    return a;
  }

  /* ── Voice lines (bot VO clips in audio/) ────────── */
  const voiceTitle         = mkAudio('audio/title.ogg');   /* title-screen VO ("Lights Out!") */
  const voiceTapCorrect    = mkAudio('audio/Tap the correct switch.ogg');
  const voicePatternA      = mkAudio('audio/These switches are in a pattern.ogg');
  const voicePatternB      = mkAudio('audio/Let us read the pattern together.ogg');
  const voiceTapContinue   = mkAudio('audio/Tap the correct switch to continue the pattern.ogg');
  const voiceWellDoneFixed = mkAudio('audio/Well done! The switches are fixed.ogg');
  const voiceYourTurn      = mkAudio('audio/Now, it is your turn to help!.ogg');
  const voiceWinGoodJob    = mkAudio('audio/Good job You fixed these switches.ogg');
  const voiceWinWuhoo      = mkAudio('audio/Wuhoo! The switches are fixed.ogg');
  const voiceWinAll        = mkAudio('audio/Well done! All the switches are fixed.ogg');
  const ALL_VOICES = [voiceTitle, voiceTapCorrect, voicePatternA, voicePatternB,
                      voiceTapContinue, voiceWellDoneFixed, voiceYourTurn,
                      voiceWinGoodJob, voiceWinWuhoo, voiceWinAll];

  /* ── Pattern-complete audio (two sounds when a pattern is finished) ── */
  const sfxElectricity  = mkAudio('audio/electricity.ogg');   /* short zap as it ignites */
  const sfxPowerUpClip  = mkAudio('audio/power_up.ogg');      /* power-up as the current flows */
  sfxElectricity.volume = 0.9;
  sfxPowerUpClip.volume = 0.85;
  function playCurrentFlow() {
    try { sfxElectricity.currentTime = 0; sfxElectricity.play().catch(() => {}); } catch (e) {}
    setTimeout(() => { try { sfxPowerUpClip.currentTime = 0; sfxPowerUpClip.play().catch(() => {}); } catch (e) {} }, 170);
  }
  function stopCurrentFlow() {   /* cut the clips when we move on (no bleed into the next screen) */
    [sfxElectricity, sfxPowerUpClip].forEach(a => { try { a.pause(); a.currentTime = 0; } catch (e) {} });
  }

  /* ── Switch appear sounds ────────────────────────── */
  const sfxSwitch3 = mkAudio('audio/3.ogg');
  const sfxSwitch5 = mkAudio('audio/5.ogg');
  const sfxSwitch4  = mkAudio('audio/4.ogg');
  const sfxSwitch7  = mkAudio('audio/7.ogg');
  const sfxSwitch10 = mkAudio('audio/10.ogg');
  const sfxSwitch11 = mkAudio('audio/11.ogg');
  const sfxSwitch13 = mkAudio('audio/13.ogg');

  const LEVEL_SWITCH_SOUNDS = {
    0: [sfxSwitch3, sfxSwitch5],
    1: [sfxSwitch4, sfxSwitch7],
    2: [sfxSwitch7, sfxSwitch10],
    3: [sfxSwitch11, sfxSwitch13],
  };

  function playSwitchAppear(index) {
    const sounds = LEVEL_SWITCH_SOUNDS[currentRow];
    if (!sounds) return;
    const snd = sounds[index % 2];
    snd.currentTime = 0;
    snd.play().catch(() => {});
  }

  let _voicePlaying = false;
  const _voiceQueue = [];

  function _setOptionsLock(locked) {
    const el = document.getElementById('options-area');
    if (el) el.style.pointerEvents = locked ? 'none' : '';
  }

  /* typewriter the dialogue out, blipping softly as the character "speaks" */
  const TYPE_MS = 90;   /* ms per character — higher = slower, easier to read along */
  let _typeTimer = null;
  function _typeBotText(text, blip = true) {
    const el = document.getElementById('bot-text');
    if (!el) return;
    el.textContent = '';
    if (_typeTimer) { clearInterval(_typeTimer); _typeTimer = null; }
    let i = 0;
    _typeTimer = setInterval(() => {
      i++;
      el.textContent = text.slice(0, i);
      const ch = text[i - 1];
      /* skip the talk blips when a real voice clip is speaking the line */
      if (blip && i % 2 === 0 && ch && ch !== ' ') sfxTalk();
      if (i >= text.length) { clearInterval(_typeTimer); _typeTimer = null; }
    }, TYPE_MS);
  }

  function _advanceQueue() {
    if (_voiceQueue.length === 0) {
      _voicePlaying = false;
      _setOptionsLock(false);
      return;
    }
    const item = _voiceQueue.shift();
    _voicePlaying = true;
    _setOptionsLock(true);
    let advanced = false;
    let watchdog = null;
    const finish = () => {
      if (advanced) return; advanced = true;
      if (watchdog) { clearTimeout(watchdog); watchdog = null; }
      if (item.audio) { item.audio.onended = null; item.audio.onerror = null; }
      if (item.onDone) item.onDone();
      _advanceQueue();
    };
    if (item.action) {
      /* custom step (e.g. read the pattern aloud) — no bot text; calls finish when
         done. Watchdog: a stalled step must never leave the options locked. */
      watchdog = setTimeout(finish, 15000);
      item.action(finish);
      return;
    }
    _typeBotText(item.text, !item.audio);
    const readHold = item.text.length * TYPE_MS + 1300;   /* typewriter time + reading hold */
    if (item.audio) {
      /* three reveal paths — ended event, error event, duration watchdog — so a
         stalled/undecodable clip can never gate the game */
      item.audio.currentTime = 0;
      item.audio.onended = finish;
      item.audio.onerror = finish;
      const est = (isFinite(item.audio.duration) && item.audio.duration > 0)
                  ? item.audio.duration * 1000 : readHold;
      watchdog = setTimeout(finish, Math.max(est, readHold) + 3000);
      /* autoplay blocked / no file → advance once the text has typed out */
      item.audio.play().catch(() => setTimeout(finish, readHold));
    } else {
      /* narration line with no audio → hold long enough to read */
      watchdog = setTimeout(finish, readHold);
    }
  }

  function queueBotText(text, audio, onDone) {
    _voiceQueue.push({ text, audio, onDone });
    if (!_voicePlaying) _advanceQueue();
  }

  /* queue a custom step that runs in sequence with the dialogue (options stay locked) */
  function queueAction(action) {
    _voiceQueue.push({ action });
    if (!_voicePlaying) _advanceQueue();
  }

  /* Level 1: read the pattern aloud — play 3,5,3,5,3 number audio and pop/highlight
     each prefilled switch in time (no text shown in the bot bar) */
  function readPatternLvl1(done) {
    const tiles = document.querySelectorAll('#switch-row .sw.filled');
    const values = [3, 5, 3, 5, 3];
    let i = 0;
    function playNext() {
      if (i >= values.length) { setTimeout(done, 350); return; }
      const v = values[i];
      const snd = v === 3 ? sfxSwitch3 : sfxSwitch5;
      const t = tiles[i];
      if (t) { t.classList.remove('read-pop'); void t.offsetWidth; t.classList.add('read-pop'); }
      i++;
      /* advance on ended / error / watchdog — whichever fires first, exactly once */
      let stepped = false, stepWatch = null;
      const step = (delay) => {
        if (stepped) return; stepped = true;
        if (stepWatch) clearTimeout(stepWatch);
        snd.onended = null; snd.onerror = null;
        setTimeout(playNext, delay);
      };
      snd.onended = () => step(160);          /* small breath between numbers */
      snd.onerror = () => step(400);
      stepWatch = setTimeout(() => step(0), 2500);   /* number clips are <1s */
      snd.currentTime = 0;
      snd.play().catch(() => step(700));      /* fallback if audio can't play */
    }
    playNext();
  }

  function clearVoiceQueue() {
    _voiceQueue.length = 0;
    _voicePlaying = false;
    _setOptionsLock(false);
    if (_typeTimer) { clearInterval(_typeTimer); _typeTimer = null; }
    ALL_VOICES.forEach(a => { try { a.pause(); a.currentTime = 0; a.onended = null; } catch (e) {} });
  }

  /* ── SFX (Web Audio API — no external files) ─────── */
  let _ctx = null;
  function ac() {
    if (!_ctx) _ctx = new (window.AudioContext || window.webkitAudioContext)();
    return _ctx;
  }

  /* master output — boosts overall SFX loudness, compressor tames peaks so it stays clean */
  let _master = null;
  function masterGain() {
    if (!_master) {
      const ctx = ac();
      _master = ctx.createGain();
      _master.gain.value = 1.9;
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -10;
      comp.ratio.value = 12;
      comp.attack.value = 0.003;
      comp.release.value = 0.25;
      _master.connect(comp);
      comp.connect(ctx.destination);
    }
    return _master;
  }

  function sfxHover() {
    const ctx = ac(), o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(masterGain());
    o.type = 'sine';
    o.frequency.setValueAtTime(1100, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.06);
    g.gain.setValueAtTime(0.06, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.07);
    o.start(ctx.currentTime); o.stop(ctx.currentTime + 0.07);
  }

  function sfxClick() {
    const ctx = ac();
    /* body click thud */
    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.06, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.012));
    const src = ctx.createBufferSource(), g = ctx.createGain();
    src.buffer = buf; src.connect(g); g.connect(masterGain());
    g.gain.setValueAtTime(0.35, ctx.currentTime);
    src.start(ctx.currentTime);
    /* tonal click layer */
    const o = ctx.createOscillator(), g2 = ctx.createGain();
    o.connect(g2); g2.connect(masterGain());
    o.type = 'square';
    o.frequency.setValueAtTime(520, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(260, ctx.currentTime + 0.08);

  /* deploy whoosh — rising energy sweep + airy whoosh, then a thunk + ding as the box lands */
  function sfxDeploy() {
    const ctx = ac();
    const t0  = ctx.currentTime;

    /* 1 — rising energy sweep (the pipes + box travelling down) */
    const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(110, t0);
    o.frequency.exponentialRampToValueAtTime(560, t0 + 1.15);
    f.type = 'lowpass';
    f.frequency.setValueAtTime(420, t0);
    f.frequency.exponentialRampToValueAtTime(2800, t0 + 1.15);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.10, t0 + 0.14);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.25);
    o.connect(f); f.connect(g); g.connect(masterGain());
    o.start(t0); o.stop(t0 + 1.3);

    /* 2 — airy whoosh (filtered noise sweeping up) */
    const dur = 1.2;
    const buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
    const nd  = buf.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    const ns = ctx.createBufferSource(), nf = ctx.createBiquadFilter(), ng = ctx.createGain();
    ns.buffer = buf; nf.type = 'bandpass'; nf.Q.value = 0.7;
    nf.frequency.setValueAtTime(280, t0);
    nf.frequency.exponentialRampToValueAtTime(2400, t0 + 1.1);
    ng.gain.setValueAtTime(0.0001, t0);
    ng.gain.exponentialRampToValueAtTime(0.05, t0 + 0.18);
    ng.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.2);
    ns.connect(nf); nf.connect(ng); ng.connect(masterGain());
    ns.start(t0); ns.stop(t0 + dur);

    /* 3 — settle: mechanical thunk + confirm ding when the box lands */
    const settleAt = t0 + 1.4;
    const tb = ctx.createBuffer(1, ctx.sampleRate * 0.09, ctx.sampleRate);
    const td = tb.getChannelData(0);
    for (let i = 0; i < td.length; i++) td[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.013));
    const ts = ctx.createBufferSource(), tg = ctx.createGain();
    ts.buffer = tb; tg.gain.setValueAtTime(0.32, settleAt);
    ts.connect(tg); tg.connect(masterGain());
    ts.start(settleAt);

    const o2 = ctx.createOscillator(), g2 = ctx.createGain();
    o2.type = 'sine';
    o2.frequency.setValueAtTime(820, settleAt);
    o2.frequency.exponentialRampToValueAtTime(1280, settleAt + 0.13);
    g2.gain.setValueAtTime(0.12, settleAt);
    g2.gain.exponentialRampToValueAtTime(0.0001, settleAt + 0.32);
    o2.connect(g2); g2.connect(masterGain());
    o2.start(settleAt); o2.stop(settleAt + 0.32);
  }
